name: signpath-preview

# A signed artifact for qualification, never an automatic publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-preview:
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
      SIGNPATH_CERTIFICATE_SHA256: ${{ vars.SIGNPATH_CERTIFICATE_SHA256 }}
      SIGNPATH_TOKEN_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require trusted source and approved provider configuration
        shell: pwsh
        run: scripts/release/signpath/ci.ps1 -Mode CheckConfig
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WrongStack/WrongStack
          ref: main
          path: target/wrongstack-source
          persist-credentials: false
      - name: Refuse unreviewed producer drift
        run: bun run baseline:check --wrongstack target/wrongstack-source --baseline contracts/baseline/wrongstack-9ec93ad7f306.json --out target/wrongstack-drift.json
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Signing content and courier regressions
        shell: pwsh
        run: scripts/release/signpath/check.ps1
      - name: Install pinned Tauri CLI
        working-directory: ${{ runner.temp }}
        run: cargo install tauri-cli --version "=2.12.4" --locked
      - name: Build unsigned staging installer and validate extracted metadata
        shell: pwsh
        run: scripts/release/package-windows.ps1
      - name: Prepare exact final program images
        id: prepare
        shell: pwsh
        run: scripts/release/signpath/ci.ps1 -Mode Prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: payloads
        with:
          name: signpath-payloads-${{ github.run_id }}
          path: target/signpath-ci/unsigned/*.exe
          if-no-files-found: error
      - name: Sign four program images
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: payloads-v1
          github-artifact-id: ${{ steps.payloads.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.prepare.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signpath-ci/signed-payloads
          skip-decompress: true
      - name: Verify and stage signed payloads
        shell: pwsh
        run: scripts/release/signpath/ci.ps1 -Mode AcceptPayloads -SignedDirectory target/signpath-ci/signed-payloads
      - name: Start non-patching signed bundle worker
        shell: pwsh
        run: scripts/release/signpath/ci.ps1 -Mode StartBundle
      - name: Await generated uninstaller
        id: uninstaller
        shell: pwsh
        run: scripts/release/signpath/ci.ps1 -Mode WaitUninstaller
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: uninstaller-artifact
        with:
          name: signpath-uninstaller-${{ github.run_id }}
          path: ${{ steps.uninstaller.outputs.file }}
          if-no-files-found: error
      - name: Sign generated uninstaller
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: uninstaller-v1
          github-artifact-id: ${{ steps.uninstaller-artifact.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.prepare.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signpath-ci/signed-uninstaller
          skip-decompress: true
      - name: Deliver verified uninstaller
        shell: pwsh
        run: scripts/release/signpath/ci.ps1 -Mode CompleteUninstaller -SignedDirectory target/signpath-ci/signed-uninstaller
      - name: Await final installer
        id: installer
        shell: pwsh
        run: scripts/release/signpath/ci.ps1 -Mode WaitInstaller
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: installer-artifact
        with:
          name: signpath-installer-${{ github.run_id }}
          path: ${{ steps.installer.outputs.file }}
          if-no-files-found: error
      - name: Sign final installer
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer-v1
          github-artifact-id: ${{ steps.installer-artifact.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.prepare.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signpath-ci/signed-installer
          skip-decompress: true
      - name: Deliver and verify completed bundle
        shell: pwsh
        run: |
          scripts/release/signpath/ci.ps1 -Mode CompleteInstaller -SignedDirectory target/signpath-ci/signed-installer
          scripts/release/signpath/ci.ps1 -Mode FinishBundle
      - name: Verify installed signed programs and uninstaller
        shell: pwsh
        run: |
          cargo test -p wrongindex-gpui --locked --no-run --message-format=json > target/signpath-ci/actor-artifacts.jsonl
          if ($LASTEXITCODE) { throw 'Actor build failed' }
          $actors = @(Get-Content target/signpath-ci/actor-artifacts.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable })
          if ($actors.Count -ne 1) { throw 'Unexpected actor executable inventory' }
          scripts/release/signpath/finalize.ps1 -GuiActorTest $actors[0].executable
      - name: Attest exact signed bytes
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/shipped/*.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrongindex-signed-preview
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
            target/release/bundle/nsis/RELEASE-MANIFEST.json
            target/release/bundle/nsis/THIRD-PARTY-LICENSES.txt
            target/release/bundle/nsis/SIGNED-PREVIEW.json
            target/release/bundle/shipped/*.exe
          if-no-files-found: error
      - name: Stop only this signing worker
        if: always()
        shell: pwsh
        run: scripts/release/signpath/ci.ps1 -Mode Abort

name: release

# Builds the per-user Windows installer (WI-700) from the exact commit and
# publishes it with a SHA-256 manifest: as a workflow artifact on manual runs,
# and as a draft GitHub release for `v*` tags.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Install the Tauri CLI
        # Outside the repository so the pinned workspace toolchain does not apply.
        working-directory: ${{ runner.temp }}
        run: cargo install tauri-cli --version "=2.12.4" --locked
      - name: Build installer
        shell: pwsh
        run: scripts/release/package-windows.ps1
      - name: Record provenance
        shell: pwsh
        run: |
          $out = 'target/release/bundle/nsis'
          @{
            commit = '${{ github.sha }}'
            ref = '${{ github.ref }}'
            run = '${{ github.run_id }}'
            rustc = (rustc -V)
            tauriCli = (cargo tauri --version)
          } | ConvertTo-Json | Set-Content "$out/PROVENANCE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wrongindex-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
            target/release/bundle/nsis/PROVENANCE.json
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $out = 'target/release/bundle/nsis'
          gh release create '${{ github.ref_name }}' --draft --title 'WrongIndex ${{ github.ref_name }}' --notes 'Per-user Windows installer. Verify with SHA256SUMS.txt.' (Get-ChildItem $out -Include *.exe,SHA256SUMS.txt,PROVENANCE.json -Recurse).FullName

name: release

# Builds the per-user Windows installer (WI-700) from the exact commit with
# a SHA-256 manifest, the release manifest (WI-703: commit, supported
# profile, toolchain, Cargo.lock, SQLite, binary and installer hashes,
# Authenticode status) and the third-party license inventory. Manual runs
# upload them as a workflow artifact; a `v*` tag publishes a GitHub release,
# which is what install.ps1, install.sh and `wrongindex self-update` install
# from. The installer and the binaries get a build-provenance attestation.
# Releases are not code-signed (owner decision, 2026-11-03).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: WrongStack/WrongStack
          ref: main
          path: target/wrongstack-source
          persist-credentials: false
      - name: Refuse unreviewed WrongStack contract drift
        run: bun run baseline:check --wrongstack target/wrongstack-source --baseline contracts/baseline/wrongstack-a6211d4792ce.json --out target/wrongstack-drift.json
      - name: Tag matches the version and has release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ((cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json).packages |
            Where-Object name -eq 'wrongindexd').version
          if ($env:TAG -ne "v$version") { throw "tag $env:TAG does not match the workspace version $version" }
          if (-not (scripts/release/changelog-section.ps1 -Version $version)) { throw "CHANGELOG.md has no section for $version" }
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Disk full on an isolated real volume
        shell: pwsh
        run: |
          if (Get-PSDrive -Name W -ErrorAction SilentlyContinue) { throw 'W: is already in use; refusing to touch it' }
          $vhd = Join-Path $env:RUNNER_TEMP "wrongindex-small-$env:GITHUB_RUN_ID.vhdx"
          $attach = Join-Path $env:RUNNER_TEMP 'wrongindex-volume-attach.txt'
          Set-Content $attach @(
            "create vdisk file=`"$vhd`" maximum=64 type=expandable",
            "select vdisk file=`"$vhd`"",
            'attach vdisk',
            'create partition primary',
            'format fs=ntfs quick label=WISMALL',
            'assign letter=W'
          )
          try {
            diskpart /s $attach
            if (-not (Test-Path 'W:\')) { throw 'The isolated test volume did not appear' }
            $env:WRONGINDEX_TEST_SMALL_VOLUME = 'W:\'
            cargo test -p wrongindexd --test real_disk_full --locked -- --ignored
            if ($LASTEXITCODE) { throw 'Real-volume disk-full acceptance failed' }
          } finally {
            $detach = Join-Path $env:RUNNER_TEMP 'wrongindex-volume-detach.txt'
            Set-Content $detach @("select vdisk file=`"$vhd`"", 'detach vdisk')
            diskpart /s $detach
          }
      - name: Install the Tauri CLI
        # Outside the repository so the pinned workspace toolchain does not apply.
        working-directory: ${{ runner.temp }}
        run: cargo install tauri-cli --version "=2.12.4" --locked
      - name: Build installer, release manifest and license inventory
        shell: pwsh
        run: scripts/release/package-windows.ps1
      - name: Native client actor acceptance against the shipped daemon
        shell: pwsh
        run: |
          $env:WRONGINDEX_TEST_DAEMON = (Resolve-Path 'target/release/bundle/shipped/wrongindexd.exe').Path
          cargo test -p wrongindex-gpui --locked -- --ignored
          if ($LASTEXITCODE) { throw 'Native client actor acceptance failed' }
      - name: Attest build provenance
        # The binaries as the installer ships them (the bundler patches the
        # desktop's copy; see scripts/release/manifest.mjs), so an installed
        # file verifies with `gh attestation verify`.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/shipped/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wrongindex-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
            target/release/bundle/nsis/RELEASE-MANIFEST.json
            target/release/bundle/nsis/THIRD-PARTY-LICENSES.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $out = 'target/release/bundle/nsis'
          $changes = (scripts/release/changelog-section.ps1 -Version $env:TAG.TrimStart('v')) -join "`n"
          $notes = @(
            $changes,
            '',
            '---',
            '',
            'Per-user Windows installer (not code-signed).',
            '',
            'Install or update:',
            '- PowerShell: `irm https://raw.githubusercontent.com/WrongStack/wrongindex/main/install.ps1 | iex`',
            '- Git Bash: `curl -fsSL https://raw.githubusercontent.com/WrongStack/wrongindex/main/install.sh | sh`',
            '- an installed copy: `wrongindex self-update`',
            '',
            'Verify by hand: `sha256sum -c SHA256SUMS.txt` and `gh attestation verify <file> --repo WrongStack/wrongindex`. RELEASE-MANIFEST.json records the commit, the supported index profile, the toolchain and every hash; THIRD-PARTY-LICENSES.txt lists the bundled components. Rebuild and compare: `pwsh scripts/release/reproduce.ps1 -Tag <tag>`.'
          ) -join "`n"
          $files = (Get-ChildItem $out -Include *.exe,SHA256SUMS.txt,RELEASE-MANIFEST.json,THIRD-PARTY-LICENSES.txt -Recurse).FullName
          gh release create $env:TAG --title "WrongIndex $env:TAG" --notes $notes --latest @files

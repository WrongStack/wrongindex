name: release

# Builds the per-user Windows installer (WI-700) from the exact commit with
# a SHA-256 manifest, the release manifest (WI-703: commit, supported
# profile, toolchain, Cargo.lock, SQLite, binary and installer hashes,
# Authenticode status) and the third-party license inventory. Manual runs
# upload unsigned engineering artifacts only. Trusted signing is prepared in
# signpath-preview.yml; publish-signed.yml promotes the exact qualified bytes.
# Historical releases were unsigned under the 2026-11-03 owner waiver.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: WrongStack/WrongStack
          ref: main
          path: target/wrongstack-source
          persist-credentials: false
      - name: Refuse unreviewed WrongStack contract drift
        run: bun run baseline:check --wrongstack target/wrongstack-source --baseline contracts/baseline/wrongstack-d4dc097e74b2.json --out target/wrongstack-drift.json
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Disk full on an isolated real volume
        shell: pwsh
        run: |
          if (Get-PSDrive -Name W -ErrorAction SilentlyContinue) { throw 'W: is already in use; refusing to touch it' }
          $vhd = Join-Path $env:RUNNER_TEMP "wrongindex-small-$env:GITHUB_RUN_ID.vhdx"
          $attach = Join-Path $env:RUNNER_TEMP 'wrongindex-volume-attach.txt'
          Set-Content $attach @(
            "create vdisk file=`"$vhd`" maximum=64 type=expandable",
            "select vdisk file=`"$vhd`"",
            'attach vdisk',
            'create partition primary',
            'format fs=ntfs quick label=WISMALL',
            'assign letter=W'
          )
          try {
            diskpart /s $attach
            if (-not (Test-Path 'W:\')) { throw 'The isolated test volume did not appear' }
            $env:WRONGINDEX_TEST_SMALL_VOLUME = 'W:\'
            cargo test -p wrongindexd --test real_disk_full --locked -- --ignored
            if ($LASTEXITCODE) { throw 'Real-volume disk-full acceptance failed' }
          } finally {
            $detach = Join-Path $env:RUNNER_TEMP 'wrongindex-volume-detach.txt'
            Set-Content $detach @("select vdisk file=`"$vhd`"", 'detach vdisk')
            diskpart /s $detach
          }
      - name: Install the Tauri CLI
        # Outside the repository so the pinned workspace toolchain does not apply.
        working-directory: ${{ runner.temp }}
        run: cargo install tauri-cli --version "=2.12.4" --locked
      - name: Build installer, release manifest and license inventory
        shell: pwsh
        run: scripts/release/package-windows.ps1
      - name: Native client actor acceptance against the shipped daemon
        shell: pwsh
        run: |
          $env:WRONGINDEX_TEST_DAEMON = (Resolve-Path 'target/release/bundle/shipped/wrongindexd.exe').Path
          # The drain regression needs the debug-only native stall hook and
          # runs in CI with a debug daemon. All four other actor cases must
          # also pass against the actual shipped release service.
          cargo test -p wrongindex-gpui --locked -- --ignored --skip debug_start_waits_for_draining_service_and_preserves_its_job
          if ($LASTEXITCODE) { throw 'Native client actor acceptance failed' }
      - name: Attest build provenance
        # The binaries as the installer ships them (the bundler patches the
        # desktop's copy; see scripts/release/manifest.mjs), so an installed
        # file verifies with `gh attestation verify`.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/shipped/*.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrongindex-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
            target/release/bundle/nsis/RELEASE-MANIFEST.json
            target/release/bundle/nsis/THIRD-PARTY-LICENSES.txt

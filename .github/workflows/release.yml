name: release

# Builds the per-user Windows installer (WI-700) from the exact commit with
# a SHA-256 manifest, the release manifest (WI-703: commit, supported
# profile, toolchain, Cargo.lock, SQLite, binary and installer hashes,
# Authenticode status) and the third-party license inventory. Manual runs
# upload them as a workflow artifact; a `v*` tag publishes a GitHub release,
# which is what install.ps1, install.sh and `wrongindex self-update` install
# from. The installer and the binaries get a build-provenance attestation.
# Releases are not code-signed (owner decision, 2026-11-03).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version and has release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ((cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json).packages |
            Where-Object name -eq 'wrongindexd').version
          if ($env:TAG -ne "v$version") { throw "tag $env:TAG does not match the workspace version $version" }
          if (-not (scripts/release/changelog-section.ps1 -Version $version)) { throw "CHANGELOG.md has no section for $version" }
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Install the Tauri CLI
        # Outside the repository so the pinned workspace toolchain does not apply.
        working-directory: ${{ runner.temp }}
        run: cargo install tauri-cli --version "=2.12.4" --locked
      - name: Build installer, release manifest and license inventory
        shell: pwsh
        run: scripts/release/package-windows.ps1
      - name: Attest build provenance
        # The binaries as the installer ships them (the bundler patches the
        # desktop's copy; see scripts/release/manifest.mjs), so an installed
        # file verifies with `gh attestation verify`.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/shipped/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wrongindex-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
            target/release/bundle/nsis/RELEASE-MANIFEST.json
            target/release/bundle/nsis/THIRD-PARTY-LICENSES.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $out = 'target/release/bundle/nsis'
          $changes = (scripts/release/changelog-section.ps1 -Version $env:TAG.TrimStart('v')) -join "`n"
          $notes = @(
            $changes,
            '',
            '---',
            '',
            'Per-user Windows installer (not code-signed).',
            '',
            'Install or update:',
            '- PowerShell: `irm https://raw.githubusercontent.com/WrongStack/wrongindex/main/install.ps1 | iex`',
            '- Git Bash: `curl -fsSL https://raw.githubusercontent.com/WrongStack/wrongindex/main/install.sh | sh`',
            '- an installed copy: `wrongindex self-update`',
            '',
            'Verify by hand: `sha256sum -c SHA256SUMS.txt` and `gh attestation verify <file> --repo WrongStack/wrongindex`. RELEASE-MANIFEST.json records the commit, the supported index profile, the toolchain and every hash; THIRD-PARTY-LICENSES.txt lists the bundled components.'
          ) -join "`n"
          $files = (Get-ChildItem $out -Include *.exe,SHA256SUMS.txt,RELEASE-MANIFEST.json,THIRD-PARTY-LICENSES.txt -Recurse).FullName
          gh release create $env:TAG --title "WrongIndex $env:TAG" --notes $notes --latest @files

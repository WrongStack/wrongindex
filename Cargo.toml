[workspace]
resolver = "3"
members = [
  "crates/wrongindex-contracts",
  "crates/wrongindex-storage",
  "crates/wrongindex-registry",
  "crates/wrongindex-discovery",
  "crates/wrongindex-engine",
  "crates/wrongindex-ipc",
  "crates/wrongindexd",
  "crates/wrongindex-cli",
  "crates/wrongindex-desktop",
]

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.93"
publish = false
license = "MIT"
repository = "https://github.com/wrongstack/wrongindex"

[workspace.dependencies]
wrongindex-contracts = { path = "crates/wrongindex-contracts" }
wrongindex-storage = { path = "crates/wrongindex-storage" }
wrongindex-registry = { path = "crates/wrongindex-registry" }
wrongindex-ipc = { path = "crates/wrongindex-ipc" }
wrongindex-discovery = { path = "crates/wrongindex-discovery" }
wrongindex-engine = { path = "crates/wrongindex-engine" }

anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
getrandom = "0.3"
hex = "=0.4.3"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
unicode-general-category = "=1.1.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
uuid = { version = "=1.29.0", features = ["v4"] }
notify = "=8.2.1"
# TS/JS parsing (WI-505/506). 0.133.0 is the newest oxc release that builds on the
# pinned 1.93 toolchain; the crates of one release must move together.
oxc_allocator = "=0.133.0"
oxc_ast = "=0.133.0"
oxc_ast_visit = "=0.133.0"
oxc_parser = "=0.133.0"
oxc_span = "=0.133.0"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-build = { version = "=2.7.4", features = [] }
# Desktop native dialogs (COM IFileDialog); the version tauri already locks.
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_IO",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_RestartManager",
] }
xxhash-rust = { version = "=0.8.19", features = ["xxh64"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
